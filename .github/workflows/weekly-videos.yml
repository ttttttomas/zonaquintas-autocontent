name: Weekly brand videos
on:
  workflow_dispatch:
  schedule:
    # Sunday 13:00 UTC = Sunday 10:00 Argentina
    - cron: '0 13 * * 0'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install HyperFrames CLI
        run: npm install --no-save hyperframes
      - name: Generate weekly brand compositions
        run: node scripts/generate.mjs
      - name: Render reels
        run: |
          mkdir -p output
          for brand in zonaquintas iweb; do
            mkdir -p "output/$brand"
            for dir in generated/"$brand"/reel-*; do
              [ -d "$dir" ] || continue
              (cd "$dir" && npx --no-install hyperframes render)
              find "$dir" -type f -name '*.mp4' -exec cp {} "output/$brand/" \;
            done
            test "$(find "output/$brand" -maxdepth 1 -name '*.mp4' | wc -l)" -ge 3
            cp "generated/$brand/editorial.json" "output/$brand/editorial.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-brand-content-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14
