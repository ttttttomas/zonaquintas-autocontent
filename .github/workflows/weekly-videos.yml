name: Weekly ZonaQuintas videos
on:
  workflow_dispatch:
  schedule:
    # 13:00 UTC = 10:00 Argentina (UTC-3), Sundays
    - cron: '0 13 * * 0'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install HyperFrames CLI
        run: npm install --no-save hyperframes
      - name: Prepare weekly compositions
        run: node scripts/generate.mjs
      - name: Render reels
        run: |
          mkdir -p output
          for dir in generated/*; do
            [ -d "$dir" ] || continue
            (cd "$dir" && npx --no-install hyperframes render)
          done
          find generated -type f -name '*.mp4' -exec cp {} output/ \;
          test "$(find output -maxdepth 1 -name '*.mp4' | wc -l)" -ge 3
      - uses: actions/upload-artifact@v4
        with:
          name: zonaquintas-reels-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14
